<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Not Found</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    .container { text-align: center; }
    h1 { font-size: 72px; margin: 0; color: #1E5A8A; }
    p { font-size: 18px; color: #666; margin: 16px 0 32px; }
    a {
      color: #1E5A8A;
      text-decoration: none;
      border: 2px solid #1E5A8A;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 16px;
      transition: all 0.2s;
    }
    a:hover { background: #1E5A8A; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>页面未找到</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
